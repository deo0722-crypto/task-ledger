<title>문화도시 소영의 할일들</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Gaegu:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --bg:#FBF2DF;
    --surface:#FDF8EC;
    --surface-2:#F3E6C8;
    --border:#DDC99A;
    --ink:#2C3568;
    --ink-soft:#6068A0;
    --muted:#A79A78;
    --muted-bg:#ECE2C7;
    --accent:#E9472B;
    --accent-soft:#FBE0D6;
    --stamp:#B65B41;
    --stamp-soft:#F3DFD3;
    --sat:#3B6EA5;
    --sun:#E9472B;
    --rule-line: rgba(44,53,104,.13);
    --margin-line: rgba(233,71,43,.4);
    --shadow: 0 1px 2px rgba(80,55,15,.09), 0 6px 16px rgba(80,55,15,.08);
    --cat-0:#E9472B; --cat-1:#3B6EA5; --cat-2:#C9932E; --cat-3:#3F8F72; --cat-4:#8C5A8C; --cat-5:#B65B41;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B2140;
      --surface:#232A4E;
      --surface-2:#2B3260;
      --border:#3B4478;
      --ink:#F3E8CD;
      --ink-soft:#C9BFA0;
      --muted:#7C87B8;
      --muted-bg:#2A3162;
      --accent:#FF6B4A;
      --accent-soft:#3B2A28;
      --stamp:#E08A6A;
      --stamp-soft:#3A2A22;
      --sat:#7FAAD6;
      --sun:#FF6B4A;
      --rule-line: rgba(243,232,205,.09);
      --margin-line: rgba(255,107,74,.35);
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.4);
      --cat-0:#FF6B4A; --cat-1:#7FAAD6; --cat-2:#E0B85E; --cat-3:#6FC2A0; --cat-4:#C48AC4; --cat-5:#E08A6A;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B2140;
    --surface:#232A4E;
    --surface-2:#2B3260;
    --border:#3B4478;
    --ink:#F3E8CD;
    --ink-soft:#C9BFA0;
    --muted:#7C87B8;
    --muted-bg:#2A3162;
    --accent:#FF6B4A;
    --accent-soft:#3B2A28;
    --stamp:#E08A6A;
    --stamp-soft:#3A2A22;
    --sat:#7FAAD6;
    --sun:#FF6B4A;
    --rule-line: rgba(243,232,205,.09);
    --margin-line: rgba(255,107,74,.35);
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.4);
    --cat-0:#FF6B4A; --cat-1:#7FAAD6; --cat-2:#E0B85E; --cat-3:#6FC2A0; --cat-4:#C48AC4; --cat-5:#E08A6A;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Gaegu","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1180px;margin:0 auto;padding:40px 24px 80px;
    background-color:var(--bg);
    background-image:
      linear-gradient(var(--rule-line) 1px, transparent 1px),
      linear-gradient(90deg, transparent 0, transparent 14px, var(--margin-line) 14px, var(--margin-line) 16px, transparent 16px);
    background-size:100% 32px, 100% 100%;
  }

  h1,h2,h3{font-family:"Noto Serif KR","Nanum Myeongjo",serif;font-weight:900;text-wrap:balance;margin:0;}
  .num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;}

  header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px;border-bottom:3px solid var(--ink);padding-bottom:20px;}
  header.top .title-block h1{font-size:34px;font-weight:900;color:var(--accent);letter-spacing:.01em;}
  header.top .title-block p{margin:6px 0 0;color:var(--ink-soft);font-size:14px;}
  .sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--ink-soft);margin-top:10px;}
  .sync-badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
  .sync-badge.synced{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .stats{display:flex;gap:10px;}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 16px;min-width:84px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:background .12s ease, border-color .12s ease;}
  .stat:hover{border-color:var(--accent);}
  .stat.active{background:var(--accent-soft);border-color:var(--accent);}
  .stat.active .n, .stat.active .l{color:var(--accent);}
  .stat .n{font-size:20px;font-weight:600;display:block;}
  .stat .l{font-size:11px;color:var(--ink-soft);letter-spacing:.04em;}

  .status-filter-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:8px 14px;font-size:12.5px;margin-bottom:14px;}
  .status-filter-chip button{background:transparent;border:none;color:var(--accent);cursor:pointer;font-size:12.5px;}

  .banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:10px 16px;font-size:13px;margin-bottom:24px;}
  .banner button{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap;}
  .banner button:hover{background:var(--accent);color:var(--surface);}

  .layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
  @media (max-width:860px){.layout{grid-template-columns:1fr;}}

  form.add{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:28px;display:flex;flex-direction:column;gap:14px;}
  form.add .row-top{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:start;}
  @media (max-width:640px){form.add .row-top{grid-template-columns:1fr;}}
  form.add .row-full{width:100%;}
  form.add .actions{display:flex;justify-content:flex-end;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.02em;}
  .field input, .field textarea{width:100%;background:transparent;border:none;border-bottom:2px dashed var(--border);border-radius:0;padding:8px 4px;color:var(--ink);font-size:14.5px;font-family:inherit;}
  .field input:focus, .field textarea:focus{outline:none;border-bottom-style:solid;border-bottom-color:var(--accent);}
  .row-full .field input{padding:9px 4px;font-size:15px;}
  .date-inputs{display:flex;align-items:center;gap:4px;}
  .date-inputs input{width:40px;text-align:center;padding:8px 4px;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;flex:none;background:var(--surface-2);border:2px solid var(--border);border-radius:6px;color:var(--ink);}
  .date-inputs input:focus{outline:none;border-color:var(--accent);}
  .date-inputs span{color:var(--ink-soft);font-size:12px;font-weight:700;}
  .date-error{font-size:11px;color:var(--stamp);margin-top:4px;min-height:14px;}
  button.submit{background:var(--accent);color:var(--surface);border:none;border-radius:10px;padding:10px 22px;font-size:15px;font-weight:700;cursor:pointer;height:40px;font-family:inherit;}
  button.submit:hover{filter:brightness(1.08);}
  button.submit:disabled{opacity:.5;cursor:not-allowed;}

  nav.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:4px;width:fit-content;margin-bottom:22px;}
  nav.tabs button{background:transparent;border:none;color:var(--ink-soft);padding:8px 18px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  nav.tabs button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}

  .status-pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px 4px 4px;font-size:12.5px;font-weight:700;cursor:pointer;border:2px solid transparent;user-select:none;white-space:nowrap;}
  .status-pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .status-pill[data-status="pending"]{background:transparent;color:var(--ink-soft);border-color:var(--border);}
  .status-pill[data-status="doing"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
  .status-pill[data-status="done"]{background:var(--muted-bg);color:var(--muted);border-color:var(--border);}
  .status-pill .dot{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;background:transparent;position:relative;flex:none;}
  .status-pill[data-status="doing"] .dot{background:conic-gradient(currentColor 0deg 180deg, transparent 180deg 360deg);}
  .status-pill[data-status="done"] .dot{background:currentColor;}
  .status-pill[data-status="done"] .dot::after{content:"\2713";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--surface);font-size:10px;font-weight:700;line-height:1;}

  .cat-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--tag-color);}
  .cat-tag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--tag-color);flex:none;}

  /* All-list view */
  .list{display:flex;flex-direction:column;gap:10px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:grid;grid-template-columns:150px 1fr 100px auto;gap:16px;align-items:center;transition:background .15s ease, opacity .15s ease, border-color .15s ease;cursor:pointer;}
  .card:hover{border-color:var(--accent);}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media (max-width:760px){.card{grid-template-columns:1fr;gap:8px;}}
  .card.done{background:var(--muted-bg);}
  .card.done .content{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted);}
  .card.done .cat-tag{opacity:.55;}
  .card .content{font-size:14.5px;line-height:1.5;}
  .card .meta{display:flex;flex-direction:column;gap:2px;}
  .card .deadline{font-size:12px;color:var(--ink-soft);}
  .card .dday{font-size:11px;font-weight:600;}
  .card .dday.over{color:var(--stamp);}
  .card .dday.today{color:var(--accent);}
  .card .note{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .card .right{display:flex;align-items:center;gap:10px;justify-content:flex-end;}
  .del{background:transparent;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;line-height:1;padding:4px;border-radius:6px;}
  .del:hover{background:var(--muted-bg);color:var(--stamp);}
  .empty{color:var(--ink-soft);font-size:13px;padding:30px 0;text-align:center;border:1px dashed var(--border);border-radius:12px;}

  /* Weekday view */
  .week-scroll{overflow-x:auto;padding-bottom:8px;}
  .week{display:grid;grid-auto-flow:column;grid-auto-columns:220px;gap:12px;min-width:min-content;}
  .day-col{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;}
  .day-head{padding:12px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;justify-content:space-between;}
  .day-head .d{font-family:"Noto Serif KR",serif;font-size:17px;font-weight:700;}
  .day-head.sat .d{color:var(--sat);}
  .day-head.sun .d{color:var(--sun);}
  .day-head .c{font-size:11px;color:var(--ink-soft);}
  .day-body{padding:10px 12px;display:flex;flex-direction:column;gap:12px;flex:1;}
  .day-sec .sec-title{font-size:11px;font-weight:600;color:var(--ink-soft);letter-spacing:.03em;margin-bottom:6px;}
  .day-sec ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;}
  .day-sec li{font-size:12.5px;background:var(--surface-2);border-radius:6px;padding:6px 8px;line-height:1.4;cursor:pointer;}
  .day-sec li:hover{background:var(--accent-soft);}
  .day-sec li:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .day-sec li.done-item{color:var(--muted);text-decoration:line-through;}
  .day-sec .cat-mini{font-size:10.5px;font-weight:600;display:block;margin-bottom:1px;}
  .day-sec .none{font-size:12px;color:var(--muted);padding:2px 2px;}

  /* Category view */
  .cat-group{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
  .cat-group-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface-2);}
  .cat-group-head .name{font-family:"Noto Serif KR",serif;font-size:16px;font-weight:700;}
  .cat-group-head .counts{display:flex;gap:8px;font-size:11.5px;color:var(--ink-soft);}
  .cat-group-body{padding:6px 16px 10px;}

  /* Calendar panel */
  .calendar-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:18px 18px 16px;position:sticky;top:20px;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-head .cal-title{font-family:"Noto Serif KR",serif;font-size:17px;font-weight:700;}
  .cal-nav{background:var(--surface-2);border:1px solid var(--border);color:var(--ink);width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:14px;line-height:1;}
  .cal-nav:hover{background:var(--accent-soft);color:var(--accent);}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px;}
  .cal-weekdays span{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:600;}
  .cal-weekdays span.sat{color:var(--sat);}
  .cal-weekdays span.sun{color:var(--sun);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-cell{position:relative;aspect-ratio:1/0.92;border-radius:8px;border:1px solid transparent;padding:4px 5px;cursor:pointer;display:flex;flex-direction:column;gap:3px;background:var(--surface-2);}
  .cal-cell:hover{border-color:var(--accent);}
  .cal-cell.pad{visibility:hidden;cursor:default;}
  .cal-cell.today{border-color:var(--accent);}
  .cal-cell.selected{background:var(--accent-soft);}
  .cal-cell .dnum{font-size:12px;font-weight:600;font-family:"IBM Plex Mono",monospace;}
  .cal-cell.sat .dnum{color:var(--sat);}
  .cal-cell.sun .dnum{color:var(--sun);}
  .cal-dots{display:flex;flex-wrap:wrap;gap:2px;}
  .cal-dots .dot{width:5px;height:5px;border-radius:50%;background:var(--dot-color);flex:none;}
  .cal-dots .more{font-size:9px;color:var(--ink-soft);}
  .cal-filter{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:8px 12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;font-size:12px;color:var(--accent);}
  .cal-filter button{background:transparent;border:none;color:var(--accent);cursor:pointer;font-size:13px;line-height:1;}
  .cal-daylist{margin-top:12px;}
  .cal-daylist .day-list-head{font-size:11.5px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em;margin-bottom:8px;}
  .cal-daylist .none{font-size:12px;color:var(--muted);padding:4px 0;}
  .cal-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;background:var(--surface-2);margin-bottom:6px;cursor:pointer;}
  .cal-item:hover{background:var(--accent-soft);}
  .cal-item:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .cal-item .cal-item-content{flex:1;font-size:12.5px;line-height:1.4;}
  .cal-item.done{opacity:.75;}
  .cal-item.done .cal-item-content{text-decoration:line-through;color:var(--muted);}
  .cal-hint{margin-top:14px;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:11.5px;color:var(--ink-soft);line-height:1.5;}
  .cal-hint::before{content:"memo";display:block;font-family:"Gaegu",sans-serif;font-weight:700;color:var(--accent);font-size:12.5px;margin-bottom:4px;}

  /* Edit modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,14,12,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .modal-overlay[hidden]{display:none;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:22px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-head h2{font-size:18px;}
  .modal-close{background:transparent;border:none;color:var(--ink-soft);font-size:15px;cursor:pointer;padding:4px 8px;border-radius:6px;line-height:1;}
  .modal-close:hover{background:var(--muted-bg);}
  #edit-form{display:flex;flex-direction:column;gap:14px;}
  .modal-actions{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}
  .modal-actions-right{display:flex;gap:8px;}
  .btn-cancel{background:transparent;border:1px solid var(--border);color:var(--ink-soft);border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit;}
  .btn-cancel:hover{background:var(--surface-2);}
  .btn-delete{background:transparent;border:1px solid var(--stamp);color:var(--stamp);border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit;}
  .btn-delete:hover{background:var(--stamp-soft);}

  ::selection{background:var(--accent-soft);color:var(--accent);}
</style>

<div class="wrap">
  <header class="top">
    <div class="title-block">
      <h1>문화도시 소영의 할일들</h1>
      <p>분류·데드라인별로 정리하는 업무 진행 관리표</p>
      <span class="sync-badge" id="sync-badge"><span class="dot"></span><span id="sync-badge-label">이 브라우저에만 저장 중</span></span>
    </div>
    <div class="stats" id="stats">
      <div class="stat" data-status="pending" role="button" tabindex="0"><span class="n num" id="stat-pending">0</span><span class="l">진행 전</span></div>
      <div class="stat" data-status="doing" role="button" tabindex="0"><span class="n num" id="stat-doing">0</span><span class="l">진행중</span></div>
      <div class="stat" data-status="done" role="button" tabindex="0"><span class="n num" id="stat-done">0</span><span class="l">완료</span></div>
    </div>
  </header>

  <div class="banner" id="example-banner">
    <span>예시 데이터가 채워져 있어요. 상태 표시를 눌러 바꿔보거나, 필요 없으면 한 번에 지울 수 있어요.</span>
    <button id="clear-examples">예시 데이터 지우기</button>
  </div>

  <div class="layout">
    <aside class="calendar-panel">
      <div class="cal-head">
        <button type="button" class="cal-nav" id="cal-prev" aria-label="이전 달">‹</button>
        <div class="cal-title num" id="cal-title"></div>
        <button type="button" class="cal-nav" id="cal-next" aria-label="다음 달">›</button>
      </div>
      <div class="cal-weekdays">
        <span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span><span class="sun">일</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-filter" id="cal-filter" hidden>
        <span id="cal-filter-label"></span>
        <button type="button" id="cal-filter-clear">선택 해제 ✕</button>
      </div>
      <div class="cal-daylist" id="cal-daylist"></div>
      <p class="cal-hint">날짜를 클릭하면 데드라인이 자동 입력되고, 달력 아래에 그 날짜의 할 일이 표시돼요.</p>
    </aside>

    <div class="main-panel">
      <form class="add" id="add-form">
        <div class="row-top">
          <div class="field">
            <label for="f-category">분류 (사업명)</label>
            <input id="f-category" list="category-options" placeholder="예: 홈페이지 개편" required>
            <datalist id="category-options"></datalist>
          </div>
          <div class="field">
            <label for="f-yy">데드라인 (YY MM DD)</label>
            <div class="date-inputs">
              <input id="f-yy" inputmode="numeric" maxlength="2" placeholder="YY">
              <span>/</span>
              <input id="f-mm" inputmode="numeric" maxlength="2" placeholder="MM">
              <span>/</span>
              <input id="f-dd" inputmode="numeric" maxlength="2" placeholder="DD">
            </div>
            <div class="date-error" id="date-error"></div>
          </div>
        </div>
        <div class="row-full field">
          <label for="f-content">내용</label>
          <input id="f-content" placeholder="예: 견적서 3곳 비교 후 업체 선정" required>
        </div>
        <div class="row-full field">
          <label for="f-note">비고</label>
          <input id="f-note" placeholder="선택 사항">
        </div>
        <div class="actions">
          <button type="submit" class="submit">추가</button>
        </div>
      </form>

      <div class="status-filter-chip" id="status-filter-chip" hidden>
        <span id="status-filter-label"></span>
        <button type="button" id="status-filter-clear">필터 해제 ✕</button>
      </div>

      <nav class="tabs" id="tabs">
        <button data-view="all" class="active">전체보기</button>
        <button data-view="week">요일별</button>
        <button data-view="category">분류별</button>
      </nav>

      <section id="view-all"></section>
      <section id="view-week" hidden></section>
      <section id="view-category" hidden></section>
    </div>
  </div>
</div>

<div class="modal-overlay" id="edit-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-title">
    <div class="modal-head">
      <h2 id="edit-title">일정 수정</h2>
      <button type="button" class="modal-close" id="edit-close" aria-label="닫기">✕</button>
    </div>
    <form id="edit-form">
      <div class="row-top">
        <div class="field">
          <label for="e-category">분류 (사업명)</label>
          <input id="e-category" list="category-options" required>
        </div>
        <div class="field">
          <label for="e-yy">데드라인 (YY MM DD)</label>
          <div class="date-inputs">
            <input id="e-yy" inputmode="numeric" maxlength="2" placeholder="YY">
            <span>/</span>
            <input id="e-mm" inputmode="numeric" maxlength="2" placeholder="MM">
            <span>/</span>
            <input id="e-dd" inputmode="numeric" maxlength="2" placeholder="DD">
          </div>
          <div class="date-error" id="edit-date-error"></div>
        </div>
      </div>
      <div class="row-full field">
        <label for="e-content">내용</label>
        <input id="e-content" required>
      </div>
      <div class="row-full field">
        <label for="e-note">비고</label>
        <input id="e-note">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-delete" id="edit-delete">삭제</button>
        <div class="modal-actions-right">
          <button type="button" class="btn-cancel" id="edit-cancel">취소</button>
          <button type="submit" class="submit">저장</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  "use strict";
  var STORAGE_KEY = "ledger.tasks.v1";
  var DAY_NAMES = ["월","화","수","목","금","토","일"];
  var STATUS_ORDER = ["pending","doing","done"];
  var STATUS_LABEL = {pending:"진행 전", doing:"진행중", done:"완료"};
  var CAT_COLORS = ["var(--cat-0)","var(--cat-1)","var(--cat-2)","var(--cat-3)","var(--cat-4)","var(--cat-5)"];

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function catColor(name){
    var h = 0;
    for (var i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) >>> 0; }
    return CAT_COLORS[h % CAT_COLORS.length];
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return seedExamples();
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return seedExamples();
      return parsed;
    }catch(e){ return seedExamples(); }
  }

  function save(tasks){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }catch(e){}
  }

  function todayISO(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }

  function offsetISO(days){
    var d = new Date();
    d.setDate(d.getDate()+days);
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }

  function seedExamples(){
    return [
      {id:uid(), category:"홈페이지 개편", content:"디자인 시안 3종 검토", deadline:offsetISO(1), note:"팀장 확인 필요", status:"doing", example:true},
      {id:uid(), category:"홈페이지 개편", content:"개발사 견적 비교", deadline:offsetISO(-1), note:"", status:"pending", example:true},
      {id:uid(), category:"상반기 마케팅", content:"인스타 광고 소재 제작", deadline:offsetISO(3), note:"예산 150만원", status:"pending", example:true},
      {id:uid(), category:"상반기 마케팅", content:"지난달 광고 성과 보고서 작성", deadline:offsetISO(-3), note:"", status:"done", example:true},
      {id:uid(), category:"사무실 이전", content:"임대차 계약서 검토", deadline:offsetISO(6), note:"법무팀 공유", status:"pending", example:true},
      {id:uid(), category:"고객 DB 정비", content:"중복 고객 데이터 정리", deadline:offsetISO(0), note:"", status:"doing", example:true}
    ];
  }

  var tasks = load();
  var activeView = "all";
  var dateFilter = null;
  var statusFilter = null;
  var today = new Date();
  var calYear = today.getFullYear();
  var calMonth = today.getMonth(); // 0-indexed

  var usingDb = false;
  var tasksCol = null;
  var dbSeeded = false;

  function exampleSeedData(){
    return {
      "ex-1": {category:"홈페이지 개편", content:"디자인 시안 3종 검토", deadline:offsetISO(1), note:"팀장 확인 필요", status:"doing", example:true},
      "ex-2": {category:"홈페이지 개편", content:"개발사 견적 비교", deadline:offsetISO(-1), note:"", status:"pending", example:true},
      "ex-3": {category:"상반기 마케팅", content:"인스타 광고 소재 제작", deadline:offsetISO(3), note:"예산 150만원", status:"pending", example:true},
      "ex-4": {category:"상반기 마케팅", content:"지난달 광고 성과 보고서 작성", deadline:offsetISO(-3), note:"", status:"done", example:true},
      "ex-5": {category:"사무실 이전", content:"임대차 계약서 검토", deadline:offsetISO(6), note:"법무팀 공유", status:"pending", example:true},
      "ex-6": {category:"고객 DB 정비", content:"중복 고객 데이터 정리", deadline:offsetISO(0), note:"", status:"doing", example:true}
    };
  }

  function docToTask(doc){
    var d = doc.data() || {};
    return {
      id: doc.id,
      category: d.category || "",
      content: d.content || "",
      deadline: d.deadline || null,
      note: d.note || "",
      status: d.status || "pending",
      example: !!d.example
    };
  }

  function setSyncBadge(state){
    var badge = document.getElementById("sync-badge");
    var label = document.getElementById("sync-badge-label");
    if (state === "synced"){
      badge.classList.add("synced");
      label.textContent = "여러 기기와 동기화됨";
    } else {
      badge.classList.remove("synced");
      label.textContent = "이 브라우저에만 저장 중";
    }
  }

  function initDb(){
    if (typeof window.claude === "undefined" || typeof window.claude.use !== "function") return;
    window.claude.use("db").then(function(db){
      if (!db) return;
      usingDb = true;
      tasksCol = db.collection("tasks");
      setSyncBadge("synced");
      tasksCol.onSnapshot(function(snap){
        if (snap.empty && !dbSeeded){
          dbSeeded = true;
          var existing = tasks.filter(function(t){ return !t.example; });
          var seedMap = {};
          if (existing.length){
            existing.forEach(function(t){
              seedMap[t.id] = {category:t.category, content:t.content, deadline:t.deadline, note:t.note, status:t.status, example:false};
            });
          } else {
            seedMap = exampleSeedData();
          }
          Object.keys(seedMap).forEach(function(id){ tasksCol.doc(id).set(seedMap[id]); });
          return;
        }
        tasks = snap.docs.map(docToTask);
        renderAll();
      }, function(){ /* keep last known local view on subscription error */ });
    });
  }

  function weekdayIndex(iso){
    if (!iso) return null;
    var parts = iso.split("-");
    var d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return (d.getDay()+6)%7; // 0=월 ... 6=일
  }

  function ddayLabel(iso){
    if (!iso) return {text:"기한 없음", cls:""};
    var today = todayISO();
    var t = new Date(today), d = new Date(iso);
    var diff = Math.round((d - t)/86400000);
    if (diff === 0) return {text:"D-day", cls:"today"};
    if (diff > 0) return {text:"D-"+diff, cls:""};
    return {text:"D+"+Math.abs(diff), cls:"over"};
  }

  function fmtDate(iso){
    if (!iso) return "";
    var p = iso.split("-");
    return p[0].slice(2)+"."+p[1]+"."+p[2];
  }

  function parseDateFields(yyId, mmId, ddId){
    var yy = document.getElementById(yyId||"f-yy").value.trim();
    var mm = document.getElementById(mmId||"f-mm").value.trim();
    var dd = document.getElementById(ddId||"f-dd").value.trim();
    if (!yy && !mm && !dd) return {iso:null, error:null};
    if (!yy || !mm || !dd) return {iso:null, error:"년/월/일을 모두 입력하세요"};
    var year = 2000+Number(yy), month = Number(mm), day = Number(dd);
    if (month<1||month>12||day<1||day>31) return {iso:null, error:"올바른 날짜가 아닙니다"};
    var d = new Date(year, month-1, day);
    if (d.getFullYear()!==year || d.getMonth()!==month-1 || d.getDate()!==day) return {iso:null, error:"올바른 날짜가 아닙니다"};
    var iso = year+"-"+String(month).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    return {iso:iso, error:null};
  }

  function setDateFields(iso){
    var p = iso.split("-");
    document.getElementById("f-yy").value = p[0].slice(2);
    document.getElementById("f-mm").value = p[1];
    document.getElementById("f-dd").value = p[2];
    document.getElementById("date-error").textContent = "";
  }

  var editingId = null;

  function openEditModal(id){
    var t = tasks.find(function(x){ return x.id === id; });
    if (!t) return;
    editingId = id;
    document.getElementById("e-category").value = t.category;
    document.getElementById("e-content").value = t.content;
    document.getElementById("e-note").value = t.note || "";
    document.getElementById("edit-date-error").textContent = "";
    if (t.deadline){
      var p = t.deadline.split("-");
      document.getElementById("e-yy").value = p[0].slice(2);
      document.getElementById("e-mm").value = p[1];
      document.getElementById("e-dd").value = p[2];
    } else {
      document.getElementById("e-yy").value = "";
      document.getElementById("e-mm").value = "";
      document.getElementById("e-dd").value = "";
    }
    document.getElementById("edit-overlay").hidden = false;
    document.getElementById("e-category").focus();
  }

  function closeEditModal(){
    editingId = null;
    document.getElementById("edit-overlay").hidden = true;
  }

  function cycleStatus(id){
    var t = tasks.find(function(x){ return x.id === id; });
    if (!t) return;
    var idx = STATUS_ORDER.indexOf(t.status);
    var next = STATUS_ORDER[(idx+1) % STATUS_ORDER.length];
    if (usingDb){ tasksCol.doc(id).update({status:next}); return; }
    t.status = next;
    save(tasks);
    renderAll();
  }

  function removeTask(id){
    if (usingDb){ tasksCol.doc(id).delete(); return; }
    tasks = tasks.filter(function(x){ return x.id !== id; });
    save(tasks);
    renderAll();
  }

  function onActivate(node, handler){
    node.addEventListener("click", handler);
    node.addEventListener("keydown", function(ev){ if (ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); handler(ev); } });
  }

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.indexOf("data-") === 0) e.setAttribute(k, attrs[k]);
      else e[k] = attrs[k];
    });
    (children||[]).forEach(function(c){ if (c) e.appendChild(c); });
    return e;
  }

  function statusPill(t){
    var pill = el("span", {
      class:"status-pill", "data-status":t.status, tabIndex:0, role:"button",
      "aria-label":"상태 변경: 현재 "+STATUS_LABEL[t.status]
    }, [ el("span",{class:"dot"}), document.createTextNode(STATUS_LABEL[t.status]) ]);
    pill.addEventListener("click", function(ev){ ev.stopPropagation(); cycleStatus(t.id); });
    pill.addEventListener("keydown", function(ev){ if (ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); ev.stopPropagation(); cycleStatus(t.id); } });
    return pill;
  }

  function catTag(category){
    var tag = el("span", {class:"cat-tag"}, [document.createTextNode(category)]);
    tag.style.setProperty("--tag-color", catColor(category));
    return tag;
  }

  function renderStats(){
    document.getElementById("stat-pending").textContent = tasks.filter(function(t){return t.status==="pending";}).length;
    document.getElementById("stat-doing").textContent = tasks.filter(function(t){return t.status==="doing";}).length;
    document.getElementById("stat-done").textContent = tasks.filter(function(t){return t.status==="done";}).length;
    Array.from(document.querySelectorAll(".stat[data-status]")).forEach(function(card){
      card.classList.toggle("active", card.getAttribute("data-status")===statusFilter);
    });
    var chip = document.getElementById("status-filter-chip");
    if (statusFilter){
      chip.hidden = false;
      document.getElementById("status-filter-label").textContent = STATUS_LABEL[statusFilter]+" 항목만 보는 중";
    } else {
      chip.hidden = true;
    }
  }

  function renderCategoryOptions(){
    var dl = document.getElementById("category-options");
    dl.innerHTML = "";
    var seen = {};
    tasks.forEach(function(t){
      if (!seen[t.category]){ seen[t.category]=true; dl.appendChild(el("option",{value:t.category})); }
    });
  }

  function renderAllView(){
    var host = document.getElementById("view-all");
    host.innerHTML = "";
    if (!tasks.length){ host.appendChild(el("div",{class:"empty"},[document.createTextNode("등록된 항목이 없습니다. 위에서 새 항목을 추가해 보세요.")])); return; }
    var base = statusFilter ? tasks.filter(function(t){ return t.status === statusFilter; }) : tasks;
    if (!base.length){ host.appendChild(el("div",{class:"empty"},[document.createTextNode("해당 상태의 항목이 없습니다.")])); return; }
    var sorted = base.slice().sort(function(a,b){
      if (!a.deadline) return 1;
      if (!b.deadline) return -1;
      return a.deadline.localeCompare(b.deadline);
    });
    var list = el("div",{class:"list"});
    sorted.forEach(function(t){
      var dday = ddayLabel(t.deadline);
      var card = el("div",{class:"card"+(t.status==="done"?" done":"")},[
        catTag(t.category),
        el("div",{},[
          el("div",{class:"content"},[document.createTextNode(t.content)]),
          t.note ? el("div",{class:"note"},[document.createTextNode("비고: "+t.note)]) : null
        ]),
        el("div",{class:"meta"},[
          el("div",{class:"deadline"},[document.createTextNode(t.deadline?fmtDate(t.deadline):"기한 없음")]),
          el("div",{class:"dday "+dday.cls},[document.createTextNode(t.deadline?dday.text:"")])
        ]),
        el("div",{class:"right"},[
          statusPill(t),
          (function(){ var b=el("button",{class:"del",title:"삭제"},[document.createTextNode("✕")]); b.addEventListener("click",function(ev){ ev.stopPropagation(); removeTask(t.id); }); return b; })()
        ])
      ]);
      card.tabIndex = 0;
      onActivate(card, function(){ openEditModal(t.id); });
      list.appendChild(card);
    });
    host.appendChild(list);
  }

  function statusBucketList(items){
    var ul = el("ul",{});
    if (!items.length){ return el("div",{class:"none"},[document.createTextNode("없음")]); }
    items.forEach(function(t){
      var li = el("li",{class:t.status==="done"?"done-item":"", tabIndex:0},[
        el("span",{class:"cat-mini",style:"color:"+catColor(t.category)},[document.createTextNode(t.category)]),
        document.createTextNode(t.content)
      ]);
      onActivate(li, function(){ openEditModal(t.id); });
      ul.appendChild(li);
    });
    return ul;
  }

  function renderWeekView(){
    var host = document.getElementById("view-week");
    host.innerHTML = "";
    var scroll = el("div",{class:"week-scroll"});
    var week = el("div",{class:"week"});
    var buckets = [[],[],[],[],[],[],[]];
    var undated = [];
    tasks.forEach(function(t){
      var idx = weekdayIndex(t.deadline);
      if (idx === null) undated.push(t); else buckets[idx].push(t);
    });
    DAY_NAMES.forEach(function(name, i){
      var items = buckets[i];
      var pending = items.filter(function(t){return t.status==="pending";});
      var doing = items.filter(function(t){return t.status==="doing";});
      var done = items.filter(function(t){return t.status==="done";});
      var headCls = i===5?"sat":(i===6?"sun":"");
      var col = el("div",{class:"day-col"},[
        el("div",{class:"day-head "+headCls},[
          el("span",{class:"d"},[document.createTextNode(name)]),
          el("span",{class:"c num"},[document.createTextNode(items.length+"건")])
        ]),
        el("div",{class:"day-body"},[
          el("div",{class:"day-sec"},[el("div",{class:"sec-title"},[document.createTextNode("해야할 일")]), statusBucketList(pending)]),
          el("div",{class:"day-sec"},[el("div",{class:"sec-title"},[document.createTextNode("하고있는 일")]), statusBucketList(doing)]),
          el("div",{class:"day-sec"},[el("div",{class:"sec-title"},[document.createTextNode("완료한 것")]), statusBucketList(done)])
        ])
      ]);
      week.appendChild(col);
    });
    // 미정 column
    var up = undated.filter(function(t){return t.status==="pending";});
    var ud = undated.filter(function(t){return t.status==="doing";});
    var udone = undated.filter(function(t){return t.status==="done";});
    week.appendChild(el("div",{class:"day-col"},[
      el("div",{class:"day-head"},[
        el("span",{class:"d"},[document.createTextNode("미정")]),
        el("span",{class:"c num"},[document.createTextNode(undated.length+"건")])
      ]),
      el("div",{class:"day-body"},[
        el("div",{class:"day-sec"},[el("div",{class:"sec-title"},[document.createTextNode("해야할 일")]), statusBucketList(up)]),
        el("div",{class:"day-sec"},[el("div",{class:"sec-title"},[document.createTextNode("하고있는 일")]), statusBucketList(ud)]),
        el("div",{class:"day-sec"},[el("div",{class:"sec-title"},[document.createTextNode("완료한 것")]), statusBucketList(udone)])
      ])
    ]));
    scroll.appendChild(week);
    host.appendChild(scroll);
  }

  function renderCategoryView(){
    var host = document.getElementById("view-category");
    host.innerHTML = "";
    if (!tasks.length){ host.appendChild(el("div",{class:"empty"},[document.createTextNode("등록된 항목이 없습니다.")])); return; }
    var order = [];
    var byCategory = {};
    tasks.forEach(function(t){
      if (!byCategory[t.category]){ byCategory[t.category]=[]; order.push(t.category); }
      byCategory[t.category].push(t);
    });
    order.forEach(function(cat){
      var items = byCategory[cat].slice().sort(function(a,b){
        if (!a.deadline) return 1; if (!b.deadline) return -1;
        return a.deadline.localeCompare(b.deadline);
      });
      var pending = items.filter(function(t){return t.status==="pending";}).length;
      var doing = items.filter(function(t){return t.status==="doing";}).length;
      var done = items.filter(function(t){return t.status==="done";}).length;
      var body = el("div",{class:"cat-group-body list"});
      items.forEach(function(t){
        var dday = ddayLabel(t.deadline);
        var card = el("div",{class:"card"+(t.status==="done"?" done":"")},[
          el("div",{},[document.createTextNode(t.deadline?fmtDate(t.deadline):"기한 없음")]),
          el("div",{},[
            el("div",{class:"content"},[document.createTextNode(t.content)]),
            t.note ? el("div",{class:"note"},[document.createTextNode("비고: "+t.note)]) : null
          ]),
          el("div",{class:"dday "+dday.cls},[document.createTextNode(t.deadline?dday.text:"")]),
          el("div",{class:"right"},[
            statusPill(t),
            (function(){ var b=el("button",{class:"del",title:"삭제"},[document.createTextNode("✕")]); b.addEventListener("click",function(ev){ ev.stopPropagation(); removeTask(t.id); }); return b; })()
          ])
        ]);
        card.style.gridTemplateColumns = "90px 1fr 70px auto";
        card.tabIndex = 0;
        onActivate(card, function(){ openEditModal(t.id); });
        body.appendChild(card);
      });
      host.appendChild(el("div",{class:"cat-group"},[
        el("div",{class:"cat-group-head"},[
          el("span",{class:"name",style:"color:"+catColor(cat)},[document.createTextNode(cat)]),
          el("span",{class:"counts"},[document.createTextNode("진행 전 "+pending+"  ·  진행중 "+doing+"  ·  완료 "+done)])
        ]),
        body
      ]));
    });
  }

  function isoOf(y,m,d){ return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"); }

  function renderCalendar(){
    document.getElementById("cal-title").textContent = calYear+"년 "+(calMonth+1)+"월";
    var grid = document.getElementById("cal-grid");
    grid.innerHTML = "";
    var byDate = {};
    tasks.forEach(function(t){
      if (!t.deadline) return;
      if (!byDate[t.deadline]) byDate[t.deadline] = [];
      byDate[t.deadline].push(t);
    });
    var firstDay = new Date(calYear, calMonth, 1);
    var leadBlank = (firstDay.getDay()+6)%7; // 월요일 시작
    var daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
    var todayIso = todayISO();

    for (var i=0;i<leadBlank;i++){ grid.appendChild(el("div",{class:"cal-cell pad"})); }

    for (var day=1; day<=daysInMonth; day++){
      var iso = isoOf(calYear, calMonth, day);
      var wd = (new Date(calYear, calMonth, day).getDay()+6)%7;
      var cls = "cal-cell";
      if (wd===5) cls += " sat"; if (wd===6) cls += " sun";
      if (iso===todayIso) cls += " today";
      if (iso===dateFilter) cls += " selected";
      var dots = el("div",{class:"cal-dots"});
      var items = byDate[iso]||[];
      items.slice(0,4).forEach(function(t){
        var d = el("span",{class:"dot"}); d.style.setProperty("--dot-color", catColor(t.category)); dots.appendChild(d);
      });
      if (items.length>4){ dots.appendChild(el("span",{class:"more"},[document.createTextNode("+"+(items.length-4))])); }
      var cell = el("div",{class:cls},[
        el("div",{class:"dnum"},[document.createTextNode(String(day))]),
        dots
      ]);
      (function(isoCapture){
        cell.addEventListener("click", function(){
          if (dateFilter === isoCapture){ dateFilter = null; } else { dateFilter = isoCapture; setDateFields(isoCapture); }
          renderAll();
        });
      })(iso);
      grid.appendChild(cell);
    }

    var filterBox = document.getElementById("cal-filter");
    if (dateFilter){
      filterBox.hidden = false;
      document.getElementById("cal-filter-label").textContent = fmtDate(dateFilter)+" 선택됨";
    } else {
      filterBox.hidden = true;
    }
    renderCalDayList();
  }

  function renderCalDayList(){
    var host = document.getElementById("cal-daylist");
    host.innerHTML = "";
    if (!dateFilter) return;
    var items = tasks.filter(function(t){ return t.deadline === dateFilter; });
    host.appendChild(el("div",{class:"day-list-head"},[document.createTextNode(fmtDate(dateFilter)+" 할 일 ("+items.length+")")]));
    if (!items.length){ host.appendChild(el("div",{class:"none"},[document.createTextNode("등록된 항목이 없습니다.")])); return; }
    items.forEach(function(t){
      var row = el("div",{class:"cal-item"+(t.status==="done"?" done":"")},[
        catTag(t.category),
        el("div",{class:"cal-item-content"},[document.createTextNode(t.content)]),
        statusPill(t),
        (function(){ var b=el("button",{class:"del",title:"삭제"},[document.createTextNode("✕")]); b.addEventListener("click",function(ev){ ev.stopPropagation(); removeTask(t.id); }); return b; })()
      ]);
      row.tabIndex = 0;
      onActivate(row, function(){ openEditModal(t.id); });
      host.appendChild(row);
    });
  }

  function renderAll(){
    renderStats();
    renderCategoryOptions();
    renderAllView();
    renderWeekView();
    renderCategoryView();
    renderCalendar();
    var banner = document.getElementById("example-banner");
    banner.hidden = !tasks.some(function(t){return t.example;});
  }

  document.getElementById("clear-examples").addEventListener("click", function(){
    var examples = tasks.filter(function(t){ return t.example; });
    if (usingDb){ examples.forEach(function(t){ tasksCol.doc(t.id).delete(); }); return; }
    tasks = tasks.filter(function(t){ return !t.example; });
    save(tasks);
    renderAll();
  });

  function wireDateInputs(ids){
    ids.forEach(function(id, idx, arr){
      var input = document.getElementById(id);
      input.addEventListener("input", function(){
        input.value = input.value.replace(/[^0-9]/g,"").slice(0,2);
        if (input.value.length===2 && idx<arr.length-1){ document.getElementById(arr[idx+1]).focus(); }
      });
    });
  }
  wireDateInputs(["f-yy","f-mm","f-dd"]);
  wireDateInputs(["e-yy","e-mm","e-dd"]);

  document.getElementById("add-form").addEventListener("submit", function(ev){
    ev.preventDefault();
    var category = document.getElementById("f-category").value.trim();
    var content = document.getElementById("f-content").value.trim();
    var note = document.getElementById("f-note").value.trim();
    var errorEl = document.getElementById("date-error");
    var parsed = parseDateFields();
    if (parsed.error){ errorEl.textContent = parsed.error; return; }
    errorEl.textContent = "";
    if (!category || !content) return;
    var newTask = {category:category, content:content, deadline:parsed.iso, note:note, status:"pending", example:false};
    if (usingDb){
      tasksCol.doc(uid()).set(newTask);
    } else {
      newTask.id = uid();
      tasks.push(newTask);
      save(tasks);
      renderAll();
    }
    ev.target.reset();
    document.getElementById("f-category").focus();
  });

  document.getElementById("edit-form").addEventListener("submit", function(ev){
    ev.preventDefault();
    if (!editingId) return;
    var t = tasks.find(function(x){ return x.id === editingId; });
    if (!t) return;
    var category = document.getElementById("e-category").value.trim();
    var content = document.getElementById("e-content").value.trim();
    var note = document.getElementById("e-note").value.trim();
    var errorEl = document.getElementById("edit-date-error");
    var parsed = parseDateFields("e-yy","e-mm","e-dd");
    if (parsed.error){ errorEl.textContent = parsed.error; return; }
    errorEl.textContent = "";
    if (!category || !content) return;
    var updated = {category:category, content:content, note:note, deadline:parsed.iso};
    if (usingDb){
      tasksCol.doc(editingId).update(updated);
    } else {
      t.category = updated.category; t.content = updated.content; t.note = updated.note; t.deadline = updated.deadline;
      save(tasks);
      renderAll();
    }
    closeEditModal();
  });

  document.getElementById("edit-delete").addEventListener("click", function(){
    if (!editingId) return;
    removeTask(editingId);
    closeEditModal();
  });
  document.getElementById("edit-close").addEventListener("click", closeEditModal);
  document.getElementById("edit-cancel").addEventListener("click", closeEditModal);
  document.getElementById("edit-overlay").addEventListener("click", function(ev){
    if (ev.target.id === "edit-overlay") closeEditModal();
  });
  document.addEventListener("keydown", function(ev){
    if (ev.key === "Escape" && !document.getElementById("edit-overlay").hidden) closeEditModal();
  });

  document.getElementById("cal-prev").addEventListener("click", function(){
    calMonth--; if (calMonth<0){ calMonth=11; calYear--; }
    renderCalendar();
  });
  document.getElementById("cal-next").addEventListener("click", function(){
    calMonth++; if (calMonth>11){ calMonth=0; calYear++; }
    renderCalendar();
  });
  document.getElementById("cal-filter-clear").addEventListener("click", function(){
    dateFilter = null;
    renderAll();
  });

  function toggleStatusFilter(status){
    statusFilter = (statusFilter === status) ? null : status;
    activeView = "all";
    Array.from(document.querySelectorAll("#tabs button")).forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-view")==="all"); });
    document.getElementById("view-all").hidden = false;
    document.getElementById("view-week").hidden = true;
    document.getElementById("view-category").hidden = true;
    renderAll();
  }

  document.getElementById("stats").addEventListener("click", function(ev){
    var card = ev.target.closest(".stat[data-status]");
    if (!card) return;
    toggleStatusFilter(card.getAttribute("data-status"));
  });
  document.getElementById("stats").addEventListener("keydown", function(ev){
    var card = ev.target.closest(".stat[data-status]");
    if (!card) return;
    if (ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); toggleStatusFilter(card.getAttribute("data-status")); }
  });
  document.getElementById("status-filter-clear").addEventListener("click", function(){
    statusFilter = null;
    renderAll();
  });

  document.getElementById("tabs").addEventListener("click", function(ev){
    var btn = ev.target.closest("button[data-view]");
    if (!btn) return;
    activeView = btn.getAttribute("data-view");
    Array.from(document.querySelectorAll("#tabs button")).forEach(function(b){ b.classList.toggle("active", b===btn); });
    document.getElementById("view-all").hidden = activeView !== "all";
    document.getElementById("view-week").hidden = activeView !== "week";
    document.getElementById("view-category").hidden = activeView !== "category";
  });

  save(tasks);
  renderAll();
  initDb();
})();
</script>
